<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#e8f4ff" />
<title>BlockMe — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Caveat:wght@700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-2: #e8f4ff;
    --card: #ffffff;
    --line: #c8dff5;
    --txt: #2b3a55;
    --muted: #7b8aa3;
    --pink: #ff5fa2;
    --pink-lt: #ffd0e4;
    --blue: #5cb8ff;
    --blue-lt: #c9e7ff;
    --yellow: #ffce5c;
    --yellow-lt: #fff1c7;
    --green: #4dd69d;
    --green-lt: #d0f5e6;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', 'Baloo 2', -apple-system, sans-serif;
    background: linear-gradient(180deg, #c8e2ff 0%, #d8ecff 30%, #e8f4ff 60%, #f8fcff 100%);
    background-attachment: fixed;
    color: var(--txt); min-height: 100vh; font-weight: 700;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* clouds */
  .cloud-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .cloud {
    position: absolute; font-size: 80px; opacity: 0.5;
    filter: drop-shadow(0 4px 10px rgba(120, 160, 200, 0.15));
    animation: drift linear infinite;
  }
  .cloud.c1 { top: 8%; left: -10%; animation-duration: 60s; font-size: 100px; }
  .cloud.c2 { top: 35%; right: -10%; animation-duration: 80s; font-size: 85px; animation-direction: reverse; }
  .cloud.c3 { top: 70%; left: -15%; animation-duration: 95s; font-size: 95px; opacity: 0.3; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(140vw); } }

  .app { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; position: relative; z-index: 1; }

  .brand {
    text-align: center; font-family: 'Baloo 2', cursive;
    font-size: 40px; font-weight: 800; margin-bottom: 8px;
    color: var(--pink); letter-spacing: -0.02em;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255, 95, 162, 0.15);
  }
  .brand span { color: var(--blue); text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(92, 184, 255, 0.15); }

  h1 { font-family: 'Baloo 2', cursive; font-size: 22px; font-weight: 800; margin-bottom: 24px; color: var(--muted); text-align: center; }
  h2 { font-family: 'Baloo 2', cursive; font-size: 20px; font-weight: 800; margin: 24px 0 12px; color: var(--txt); }

  .card {
    background: #fff; border-radius: 20px; padding: 20px;
    border: 2px solid var(--line);
    box-shadow: 0 6px 0 rgba(200, 223, 245, 0.5), 0 12px 28px rgba(120, 160, 200, 0.12);
    margin-bottom: 14px;
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat {
    background: #fff; border-radius: 18px; padding: 18px;
    border: 2px solid var(--line); text-align: center;
    box-shadow: 0 6px 0 rgba(200, 223, 245, 0.5);
  }
  .stat-num {
    font-family: 'Caveat', cursive; font-size: 52px; font-weight: 700; line-height: 1;
    color: var(--pink);
  }
  .stat-label {
    font-size: 11px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-top: 6px;
  }

  .btn {
    padding: 12px 20px; border-radius: 14px; font-family: inherit;
    font-size: 14px; font-weight: 800; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ff5fa2, #ff85b8); color: #fff;
    box-shadow: 0 4px 0 #d83a7e;
    transition: transform .1s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d83a7e; }
  .btn-ghost {
    background: #fff; border: 2px solid var(--line); color: var(--txt);
    box-shadow: 0 4px 0 rgba(200, 223, 245, 0.6);
  }
  .btn-ghost:active { box-shadow: 0 2px 0 rgba(200, 223, 245, 0.6); }
  .btn-danger { color: var(--red); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .field input {
    width: 100%; padding: 15px 16px; background: #f7fbff;
    border: 2px solid var(--line); border-radius: 14px; color: var(--txt);
    font-size: 16px; font-family: inherit; font-weight: 700; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .field input:focus {
    border-color: var(--pink); background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 95, 162, 0.12);
  }
  .field input::placeholder { color: #a8b8d0; }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 2px solid var(--line); border-radius: 16px;
    padding: 14px 18px; margin-bottom: 10px;
    box-shadow: 0 4px 0 rgba(200, 223, 245, 0.5);
  }
  .row-info { flex: 1; }
  .row-name { font-weight: 800; font-size: 15px; color: var(--txt); }
  .row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 700; }
  .row-meta code { background: #f0f7ff; padding: 1px 6px; border-radius: 6px; font-size: 11px; color: var(--blue); }
  .row-count {
    font-family: 'Caveat', cursive; font-size: 32px; font-weight: 700;
    color: var(--pink);
  }

  .muted { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; font-weight: 700; }

  #authScreen { max-width: 380px; margin: 80px auto; text-align: center; }
  #authScreen .brand { font-size: 48px; }
  #authScreen h1 { font-size: 18px; color: var(--muted); margin-bottom: 24px; font-weight: 700; }

  #mainScreen { display: none; }

  .header-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .header-row .muted { padding: 0; text-align: left; }

  .bear-row { display: flex; justify-content: center; gap: 8px; font-size: 42px; margin-bottom: 4px; }
  .bear-row span { display: inline-block; animation: bounce 2.4s ease-in-out infinite; }
  .bear-row span:nth-child(1) { transform: rotate(-6deg); }
  .bear-row span:nth-child(2) { animation-delay: .3s; transform: rotate(6deg); }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }

  .row-actions { display: flex; gap: 6px; margin-left: 10px; }
  .row-actions button {
    background: transparent; border: none; font-size: 18px;
    cursor: pointer; padding: 4px;
  }
</style>
</head>
<body>

<div class="cloud-bg">
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>
</div>

<div class="app">

  <!-- AUTH -->
  <div id="authScreen">
    <div class="bear-row"><span>🐻</span><span>🐼</span></div>
    <div class="brand">Block<span>Me</span> Admin</div>
    <h1>Enter password 🔒</h1>
    <div class="card">
      <div class="field">
        <input id="pwd" type="password" placeholder="••••••••" autocomplete="off" />
      </div>
      <button class="btn" style="width:100%;" id="loginBtn">Unlock 🔓</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div class="bear-row"><span>🐻</span><span>🐼</span></div>
    <div class="brand">Block<span>Me</span> Admin</div>

    <div class="header-row">
      <span class="muted" id="lastUpdate">—</span>
      <button class="btn btn-ghost" id="logoutBtn" style="padding:8px 14px;font-size:12px;">Logout</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-num" id="sQuizzes">—</div><div class="stat-label">Quizzes</div></div>
      <div class="stat"><div class="stat-num" id="sResps">—</div><div class="stat-label">Responses</div></div>
      <div class="stat"><div class="stat-num" id="sAvg">—</div><div class="stat-label">Avg score</div></div>
      <div class="stat"><div class="stat-num" id="sBlocked">—</div><div class="stat-label">Blocked %</div></div>
    </div>

    <h2>🏆 All quizzes</h2>
    <div id="quizList"><p class="muted">Loading…</p></div>

    <h2>💌 Recent responses</h2>
    <div id="respList"><p class="muted">Loading…</p></div>

    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" id="refreshBtn" style="flex:1;">🔄 Refresh</button>
      <button class="btn btn-ghost btn-danger" id="clearBtn" style="flex:1;">⚠ Clear all data</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   CONFIG — same as index.html
   ============================================================ */
const CONFIG = {
  UPSTASH_URL: "https://evolved-chimp-224053.upstash.io",
  UPSTASH_TOKEN: "gQAAAAAAA2s1AAIgcDI1MzI1Y2MxMjc4NDI0ZTlhYjQ3ZDRiMzIyOTUzMWRiYg",
  ADMIN_PASSWORD: "1"
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function redis(...cmd) {
  const res = await fetch(CONFIG.UPSTASH_URL, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${CONFIG.UPSTASH_TOKEN}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(cmd)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.result;
}

function checkAuth() {
  const ok = sessionStorage.getItem("bm.admin") === "1";
  $("authScreen").style.display = ok ? "none" : "block";
  $("mainScreen").style.display = ok ? "block" : "none";
  if (ok) loadData();
}
$("loginBtn").onclick = () => {
  if ($("pwd").value === CONFIG.ADMIN_PASSWORD) {
    sessionStorage.setItem("bm.admin", "1");
    checkAuth();
  } else {
    alert("Wrong password");
  }
};
$("pwd").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => { sessionStorage.removeItem("bm.admin"); checkAuth(); };

async function loadData() {
  $("quizList").innerHTML = '<p class="muted">Loading…</p>';
  $("respList").innerHTML = '<p class="muted">Loading…</p>';

  let quizIds = [], quizzes = [], allResps = [];

  try {
    quizIds = await redis("SMEMBERS", "quizzes:all") || [];
    const quizCommands = quizIds.map(id => ["GET", `quiz:${id}`]);
    const respCommands = quizIds.map(id => ["LRANGE", `resp:${id}`, 0, -1]);
    const [qRes, rRes] = await Promise.all([
      fetch(`${CONFIG.UPSTASH_URL}/pipeline`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${CONFIG.UPSTASH_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify(quizCommands)
      }).then(r => r.json()),
      fetch(`${CONFIG.UPSTASH_URL}/pipeline`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${CONFIG.UPSTASH_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify(respCommands)
      }).then(r => r.json())
    ]);
    quizzes = (qRes || []).map(x => { try { return JSON.parse(x.result); } catch { return null; } }).filter(Boolean);
    const respArrays = (rRes || []).map(x => Array.isArray(x.result) ? x.result : []);
    allResps = [];
    quizzes.forEach((q, i) => {
      respArrays[i].forEach(raw => {
        try {
          const r = JSON.parse(raw);
          allResps.push({ ...r, quiz_id: q.id, quiz_creator: q.creator });
        } catch {}
      });
    });
  } catch (e) {
    console.error(e);
    $("quizList").innerHTML = '<p class="muted">Failed to load. Check Upstash config.</p>';
    return;
  }

  $("sQuizzes").textContent = quizzes.length;
  $("sResps").textContent = allResps.length;
  const avg = allResps.length ? (allResps.reduce((s, r) => s + (r.score || 0), 0) / allResps.length).toFixed(1) : "—";
  $("sAvg").textContent = avg;

  // "blocked %" = kitne % players ne 3 se kam score kiya (blocked zone)
  if (allResps.length) {
    const blocked = allResps.filter(r => (r.score / (r.total || 10)) < 0.35).length;
    const pct = Math.round(blocked / allResps.length * 100);
    $("sBlocked").textContent = pct + "%";
  } else {
    $("sBlocked").textContent = "—";
  }

  $("lastUpdate").textContent = "Updated " + new Date().toLocaleTimeString();

  const counts = {};
  allResps.forEach(r => counts[r.quiz_id] = (counts[r.quiz_id] || 0) + 1);

  if (!quizzes.length) {
    $("quizList").innerHTML = '<p class="muted">No quizzes yet. Share the site 🐻</p>';
  } else {
    $("quizList").innerHTML = quizzes
      .sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0))
      .map(q => `
        <div class="row">
          <div class="row-info">
            <div class="row-name">🐻 ${esc(q.creator)}</div>
            <div class="row-meta">${q.questions?.length || 0} questions · <code>${esc(q.id)}</code> · ${new Date(q.created_at || Date.now()).toLocaleString()}</div>
          </div>
          <div class="row-count">${counts[q.id] || 0}</div>
        </div>
      `).join("");
  }

  if (!allResps.length) {
    $("respList").innerHTML = '<p class="muted">No responses yet.</p>';
  } else {
    $("respList").innerHTML = allResps
      .sort((a, b) => (b.at || 0) - (a.at || 0))
      .slice(0, 30)
      .map(r => {
        const total = r.total || 10;
        const pct = (r.score || 0) / total;
        const emoji = pct >= 0.95 ? "💖" : pct >= 0.75 ? "✨" : pct >= 0.55 ? "🌸" : pct >= 0.35 ? "🍃" : pct >= 0.15 ? "😅" : "🚫";
        return `
          <div class="row">
            <div class="row-info">
              <div class="row-name">${emoji} ${esc(r.guesser || "Anonymous")} <span style="color:var(--muted);font-weight:600;font-size:13px;">on ${esc(r.quiz_creator || "?")}'s quiz</span></div>
              <div class="row-meta">${new Date(r.at || Date.now()).toLocaleString()}</div>
            </div>
            <div class="row-count">${r.score}/${total}</div>
          </div>
        `;
      }).join("");
  }
}

$("refreshBtn").onclick = loadData;
$("clearBtn").onclick = async () => {
  if (!confirm("Delete ALL quizzes and responses? This cannot be undone.")) return;
  if (!confirm("Are you REALLY sure?")) return;
  try {
    const ids = await redis("SMEMBERS", "quizzes:all") || [];
    for (const id of ids) {
      await redis("DEL", `quiz:${id}`);
      await redis("DEL", `resp:${id}`);
    }
    await redis("DEL", "quizzes:all");
    await redis("DEL", "stats:quizzes");
    await redis("DEL", "stats:responses");
    alert("All cleared. 🐻");
    loadData();
  } catch (e) { alert("Failed: " + e.message); }
};

checkAuth();
</script>
</body>
</html>
